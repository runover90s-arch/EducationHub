<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="title desc">
<title id="title">So sánh quãng đường và độ lớn độ dời</title>
<desc id="desc">Vật đi từ x1 đến biên cộng A rồi đổi chiều về x2. Quãng đường là tổng hai đoạn đã đi và lớn hơn độ lớn độ dời giữa x1 và x2.</desc>
<style>
  .bg { fill: #ffffff; }
  .axis { stroke: #263238; stroke-width: 3; fill: none; }
  .grid { stroke: #cfd8dc; stroke-width: 1.5; stroke-dasharray: 6 6; fill: none; }
  .guide { stroke: #90a4ae; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
  .blue { stroke: #1565c0; fill: none; }
  .green { stroke: #2e7d32; fill: none; }
  .red { stroke: #c62828; fill: none; }
  .orange { stroke: #ef6c00; fill: none; }
  .purple { stroke: #6a1b9a; fill: none; }
  .bluefill { fill: #1565c0; }
  .greenfill { fill: #2e7d32; }
  .redfill { fill: #c62828; }
  .orangefill { fill: #ef6c00; }
  .purplefill { fill: #6a1b9a; }
  .mutedfill { fill: #546e7a; }
  .label { font: 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #263238; }
  .small { font: 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #37474f; }
  .tiny { font: 21px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #455a64; }
  .strong { font-weight: 700; }
  .center { text-anchor: middle; }
  .right { text-anchor: end; }
</style>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#263238"/></marker>
  <marker id="arrow-blue" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#1565c0"/></marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#2e7d32"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#c62828"/></marker>
  <marker id="arrow-orange" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#ef6c00"/></marker>

</defs>
<rect class="bg" x="1" y="1" width="758" height="508" rx="18" stroke="#cfd8dc" stroke-width="2"/>

<text x="380" y="42" class="label strong center">Quãng đường không nhất thiết bằng độ lớn độ dời</text>
<line x1="80" y1="220" x2="700" y2="220" class="axis" marker-end="url(#arrow)"/>
<line x1="110" y1="198" x2="110" y2="242" class="axis"/>
<line x1="380" y1="198" x2="380" y2="242" class="axis"/>
<line x1="650" y1="198" x2="650" y2="242" class="axis"/>
<text x="110" y="276" class="small strong center">−A</text>
<text x="380" y="276" class="small strong center">O</text>
<text x="650" y="276" class="small strong center">+A</text>
<circle cx="270" cy="220" r="10" class="greenfill"/>
<circle cx="470" cy="220" r="10" class="orangefill"/>
<text x="270" y="310" class="small greenfill strong center">x₁</text>
<text x="470" y="310" class="small orangefill strong center">x₂</text>
<path d="M 270 155 L 640 155" stroke="#1565c0" stroke-width="6" fill="none" marker-end="url(#arrow-blue)"/>
<text x="455" y="140" class="small bluefill strong center">1. đi tới biên +A</text>
<path d="M 640 105 L 480 105" stroke="#ef6c00" stroke-width="6" fill="none" marker-end="url(#arrow-orange)"/>
<text x="560" y="88" class="small orangefill strong center">2. đổi chiều về x₂</text>
<line x1="270" y1="350" x2="470" y2="350" stroke="#546e7a" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="370" y="382" class="small center">|Δx| = |x₂ − x₁|</text>
<rect x="100" y="405" width="560" height="72" rx="14" fill="#f7f9fa" stroke="#cfd8dc" stroke-width="2"/>
<text x="380" y="435" class="small center">Nếu vật đổi chiều ở +A:</text>
<text x="380" y="466" class="small strong center">S = (A − x₁) + (A − x₂) &gt; |x₂ − x₁|</text>

</svg>
