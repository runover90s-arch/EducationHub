<line x1="455" y1="445" x2="680" y2="445" class="guide"/>
<line x1="455" y1="320" x2="455" y2="380" class="orange" stroke-width="4" marker-start="url(#arrow-start)" marker-end="url(#arrow-orange)"/><text x="470" y="357" class="small">Δℓ₀</text>
<line x1="680" y1="380" x2="680" y2="445" class="purple" stroke-width="4" marker-start="url(#arrow-start)" marker-end="url(#arrow-purple)"/><text x="666" y="420" class="small right">x</text>
<line x1="710" y1="270" x2="710" y2="470" class="axis" marker-end="url(#arrow)"/><text x="704" y="255" class="tiny right">chiều dương</text>
<text x="380" y="545" class="tiny center">Chọn chiều dương hướng xuống nên độ dãn tức thời bằng Δℓ₀ + x.</text>
<text x="380" y="575" class="tiny center">Li độ x được đo từ VTCB, không đo từ chiều dài tự nhiên ℓ₀.</text>
</svg>
