<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc">
<title id="title">Đồ thị năng lượng theo li độ</title>
<desc id="desc">Trên miền từ trừ A đến cộng A, thế năng là parabol mở lên, động năng là parabol mở xuống và cơ năng là đường ngang; hai dạng năng lượng bằng nhau tại cộng trừ A trên căn hai.</desc>
