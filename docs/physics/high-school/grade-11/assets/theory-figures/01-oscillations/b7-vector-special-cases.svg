<svg xmlns="http://www.w3.org/2000/svg" width="760" height="785" viewBox="0 0 760 785" role="img" aria-labelledby="title desc">
<title id="title">Ba trường hợp đặc biệt khi tổng hợp dao động</title>
<desc id="desc">Ba sơ đồ cộng vectơ cho hai dao động cùng pha, vuông pha và ngược pha, lần lượt cho tổng độ dài, định lí Pythagore và hiệu độ dài.</desc>
<style>
.bg{fill:#fff} .axis{stroke:#263238;stroke-width:3;fill:none} .guide{stroke:#90a4ae;stroke-width:2;stroke-dasharray:7 6;fill:none} .grid{stroke:#cfd8dc;stroke-width:1.5;stroke-dasharray:6 6;fill:none}
.blue{stroke:#1565c0;fill:none} .green{stroke:#2e7d32;fill:none} .red{stroke:#c62828;fill:none} .orange{stroke:#ef6c00;fill:none} .purple{stroke:#6a1b9a;fill:none} .teal{stroke:#00838f;fill:none}
.bluefill{fill:#1565c0} .greenfill{fill:#2e7d32} .redfill{fill:#c62828} .orangefill{fill:#ef6c00} .purplefill{fill:#6a1b9a} .mutedfill{fill:#546e7a}
.label{font:28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#263238} .small{font:24px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#37474f} .tiny{font:21px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#455a64} .strong{font-weight:700} .center{text-anchor:middle} .right{text-anchor:end}
</style>
<defs>
<marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#263238"/></marker>
<marker id="arrow-blue" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#1565c0"/></marker>
<marker id="arrow-green" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#2e7d32"/></marker>
<marker id="arrow-red" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#c62828"/></marker>
<marker id="arrow-orange" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#ef6c00"/></marker>
<marker id="arrow-purple" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#6a1b9a"/></marker>
<marker id="arrow-start" markerWidth="12" markerHeight="10" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L11,8 L0,4 z" fill="#263238"/></marker>
</defs>
<rect class="bg" x="1" y="1" width="758" height="783" rx="18" stroke="#cfd8dc" stroke-width="2"/>
<text x="380" y="43" class="label strong center">Ba trường hợp pha đặc biệt nhìn bằng phép cộng vectơ</text>
<text x="95" y="85" class="small strong">Cùng pha</text><circle cx="150" cy="155" r="6" class="mutedfill"/><line x1="150" y1="155" x2="340" y2="155" class="blue" stroke-width="7" marker-end="url(#arrow-blue)"/><line x1="340" y1="155" x2="490" y2="155" class="green" stroke-width="7" marker-end="url(#arrow-green)"/><line x1="150" y1="200" x2="490" y2="200" class="purple" stroke-width="7" marker-end="url(#arrow-purple)"/><text x="245" y="140" class="tiny center">A₁</text><text x="415" y="140" class="tiny center">A₂</text><text x="520" y="208" class="small" fill="#6a1b9a">A=A₁+A₂</text><text x="95" y="295" class="small strong">Vuông pha</text><circle cx="150" cy="365" r="6" class="mutedfill"/><line x1="150" y1="365" x2="350" y2="365" class="blue" stroke-width="7" marker-end="url(#arrow-blue)"/><line x1="350" y1="365" x2="350" y2="215" class="green" stroke-width="7" marker-end="url(#arrow-green)"/><line x1="150" y1="365" x2="350" y2="215" class="purple" stroke-width="7" marker-end="url(#arrow-purple)"/><text x="250" y="400" class="tiny center">A₁</text><text x="375" y="290" class="tiny">A₂</text><text x="490" y="300" class="small" fill="#6a1b9a">A²=A₁²+A₂²</text><text x="95" y="515" class="small strong">Ngược pha</text><circle cx="150" cy="585" r="6" class="mutedfill"/><line x1="150" y1="585" x2="450" y2="585" class="blue" stroke-width="7" marker-end="url(#arrow-blue)"/><line x1="450" y1="585" x2="300" y2="585" class="green" stroke-width="7" marker-end="url(#arrow-green)"/><line x1="150" y1="630" x2="300" y2="630" class="purple" stroke-width="7" marker-end="url(#arrow-purple)"/><text x="300" y="569" class="tiny center">A₁</text><text x="375" y="620" class="tiny center">A₂</text><text x="500" y="638" class="small" fill="#6a1b9a">A=|A₁−A₂|</text><text x="380" y="755" class="tiny center">Cùng pha kéo dài vectơ tổng; ngược pha làm hai vectơ triệt bớt nhau.</text>
</svg>
