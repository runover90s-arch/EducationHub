<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 455" role="img" aria-labelledby="title desc">
<title id="title">Chọn cung theo chiều tăng pha</title>
<desc id="desc">Trạng thái đầu A có pha pi trên ba và trạng thái cuối B có pha năm pi trên ba. Cung theo chiều tăng pha là bốn pi trên ba dù cung hình học nhỏ hai pi trên ba nằm ngược chiều.</desc>
<style>
  .bg { fill: #ffffff; }
  .axis { stroke: #263238; stroke-width: 3; fill: none; }
  .grid { stroke: #cfd8dc; stroke-width: 1.5; stroke-dasharray: 6 6; fill: none; }
  .guide { stroke: #90a4ae; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
  .blue { stroke: #1565c0; fill: none; }
  .green { stroke: #2e7d32; fill: none; }
  .red { stroke: #c62828; fill: none; }
  .orange { stroke: #ef6c00; fill: none; }
  .purple { stroke: #6a1b9a; fill: none; }
  .bluefill { fill: #1565c0; }
  .greenfill { fill: #2e7d32; }
  .redfill { fill: #c62828; }
  .orangefill { fill: #ef6c00; }
  .purplefill { fill: #6a1b9a; }
  .mutedfill { fill: #546e7a; }
  .label { font: 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #263238; }
  .small { font: 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #37474f; }
  .tiny { font: 21px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #455a64; }
  .strong { font-weight: 700; }
  .center { text-anchor: middle; }
  .right { text-anchor: end; }
</style>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#263238"/></marker>
  <marker id="arrow-blue" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#1565c0"/></marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#2e7d32"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#c62828"/></marker>
  <marker id="arrow-orange" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#ef6c00"/></marker>

</defs>
<rect class="bg" x="1" y="1" width="758" height="453" rx="18" stroke="#cfd8dc" stroke-width="2"/>

<text x="380" y="42" class="label strong center">Thời gian ngắn nhất phải theo chiều pha tăng</text>
<circle cx="300" cy="250" r="150" class="axis"/>
<line x1="300" y1="250" x2="375.0" y2="120.1" class="guide"/>
<line x1="300" y1="250" x2="375.0" y2="379.9" class="guide"/>
<circle cx="375.0" cy="120.1" r="10" class="greenfill"/>
<circle cx="375.0" cy="379.9" r="10" class="orangefill"/>
<text x="393.0" y="112.1" class="small greenfill strong">A: Φ₁ = π/3</text>
<text x="393.0" y="389.9" class="small orangefill strong">B: Φ₂ = 5π/3</text>
<path d="M 375.0 120.1 A 150 150 0 1 0 375.0 379.9" stroke="#1565c0" stroke-width="8" fill="none" marker-end="url(#arrow-blue)"/>
<path d="M 375.0 120.1 A 128 128 0 0 1 375.0 379.9" stroke="#90a4ae" stroke-width="4" stroke-dasharray="8 7" fill="none"/>
<text x="105" y="250" class="small bluefill strong center">đúng chiều:</text>
<text x="105" y="282" class="small bluefill strong center">ΔΦ = 4π/3</text>
<text x="510" y="250" class="tiny center">cung nhỏ 2π/3</text>
<text x="510" y="278" class="tiny center">nhưng ngược chiều pha</text>
<rect x="480" y="330" width="235" height="95" rx="14" fill="#f7f9fa" stroke="#cfd8dc" stroke-width="2"/>
<text x="598" y="365" class="small strong center">Δt = ΔΦ / ω</text>
<text x="598" y="401" class="tiny center">chọn ΔΦ dương nhỏ nhất</text>

</svg>
