<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
<title id="title">Ba đồ thị li độ vận tốc gia tốc</title>
<desc id="desc">Ba đồ thị chuẩn hóa x trên A, v trên omega A và a trên omega bình A theo cùng thời gian. Vận tốc sớm pha pi trên 2 so với li độ và gia tốc ngược pha với li độ.</desc>
