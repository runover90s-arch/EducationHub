<svg xmlns="http://www.w3.org/2000/svg" width="760" height="630" viewBox="0 0 760 630" role="img" aria-labelledby="title desc">
<title id="title">Thí nghiệm xác định gia tốc trọng trường bằng con lắc đơn</title>
<desc id="desc">Sơ đồ đo chiều dài từ điểm treo đến tâm vật, đo thời gian nhiều chu kì, rồi vẽ đồ thị T bình phương theo l để lấy hệ số góc và suy ra g.</desc>
<style>
.bg{fill:#fff} .axis{stroke:#263238;stroke-width:3;fill:none} .guide{stroke:#90a4ae;stroke-width:2;stroke-dasharray:7 6;fill:none} .grid{stroke:#cfd8dc;stroke-width:1.5;stroke-dasharray:6 6;fill:none}
.blue{stroke:#1565c0;fill:none} .green{stroke:#2e7d32;fill:none} .red{stroke:#c62828;fill:none} .orange{stroke:#ef6c00;fill:none} .purple{stroke:#6a1b9a;fill:none} .teal{stroke:#00838f;fill:none}
.bluefill{fill:#1565c0} .greenfill{fill:#2e7d32} .redfill{fill:#c62828} .orangefill{fill:#ef6c00} .purplefill{fill:#6a1b9a} .mutedfill{fill:#546e7a}
.label{font:28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#263238} .small{font:24px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#37474f} .tiny{font:21px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#455a64} .strong{font-weight:700} .center{text-anchor:middle} .right{text-anchor:end}
</style>
<defs>
<marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#263238"/></marker>
<marker id="arrow-blue" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#1565c0"/></marker>
<marker id="arrow-green" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#2e7d32"/></marker>
<marker id="arrow-red" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#c62828"/></marker>
<marker id="arrow-orange" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#ef6c00"/></marker>
<marker id="arrow-purple" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#6a1b9a"/></marker>
<marker id="arrow-start" markerWidth="12" markerHeight="10" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L11,8 L0,4 z" fill="#263238"/></marker>
</defs>
<rect class="bg" x="1" y="1" width="758" height="628" rx="18" stroke="#cfd8dc" stroke-width="2"/>
<text x="380" y="43" class="label strong center">Đo g bằng con lắc: đo đúng rồi tuyến tính hóa</text>
<text x="200" y="92" class="small strong center">1. Đo chiều dài và chu kì</text>
<line x1="145" y1="120" x2="255" y2="120" class="axis"/><circle cx="200" cy="130" r="7" class="mutedfill"/>
<line x1="200" y1="130" x2="200" y2="350" class="blue" stroke-width="5"/><circle cx="200" cy="350" r="30" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
<line x1="290" y1="130" x2="290" y2="350" class="purple" stroke-width="4" marker-start="url(#arrow-start)" marker-end="url(#arrow-purple)"/><text x="310" y="248" class="small">ℓ</text>
<rect x="70" y="385" width="260" height="88" rx="16" fill="#f5f5f5" stroke="#90a4ae" stroke-width="2"/><text x="200" y="420" class="small strong center">Đo thời gian tN của N chu kì</text><text x="200" y="458" class="small center">T = tN / N</text>
<text x="560" y="92" class="small strong center">2. Vẽ T² theo ℓ</text>
<line x1="420" y1="430" x2="695" y2="430" class="axis" marker-end="url(#arrow)"/><line x1="440" y1="455" x2="440" y2="145" class="axis" marker-end="url(#arrow)"/>
<text x="695" y="465" class="small right">ℓ</text><text x="470" y="160" class="small">T²</text>
<line x1="440" y1="430" x2="660" y2="190" class="green" stroke-width="6"/>
<circle cx="495" cy="370" r="6" class="greenfill"/><circle cx="550" cy="310" r="6" class="greenfill"/><circle cx="605" cy="250" r="6" class="greenfill"/>
<path d="M500,430 A60,60 0 0 0 482,386" class="orange" stroke-width="4" fill="none"/><text x="510" y="392" class="small" fill="#ef6c00">a</text>
<text x="560" y="505" class="tiny center">Hệ số góc a = 4π²/g</text><text x="560" y="540" class="tiny strong center">⇒ g = 4π²/a</text>
<text x="380" y="582" class="tiny center">Đo nhiều chu kì giúp giảm sai số bấm giờ.</text><text x="380" y="608" class="tiny center">Dùng nhiều giá trị ℓ giúp xác định hệ số góc của đường thẳng ổn định hơn.</text>
</svg>
