<title id="title">Đường cong cộng hưởng với hai mức lực cản</title>
<desc id="desc">Biên độ ổn định theo tỉ số tần số cưỡng bức trên tần số riêng; lực cản nhỏ cho đỉnh cao hẹp gần một, lực cản lớn hơn cho đỉnh thấp và rộng.</desc>
