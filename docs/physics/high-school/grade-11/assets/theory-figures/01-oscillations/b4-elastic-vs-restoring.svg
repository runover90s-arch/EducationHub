<svg xmlns="http://www.w3.org/2000/svg" width="760" height="615" viewBox="0 0 760 615" role="img" aria-labelledby="title desc">
<title id="title">So sánh lực đàn hồi và lực kéo về của lò xo treo đứng</title>
<desc id="desc">Hai sơ đồ lực tại vị trí cân bằng và khi vật ở dưới vị trí cân bằng: lực đàn hồi hướng lên, trọng lực hướng xuống; lực kéo về là hợp lực và bằng không tại vị trí cân bằng.</desc>
<style>
.bg{fill:#fff} .axis{stroke:#263238;stroke-width:3;fill:none} .guide{stroke:#90a4ae;stroke-width:2;stroke-dasharray:7 6;fill:none} .grid{stroke:#cfd8dc;stroke-width:1.5;stroke-dasharray:6 6;fill:none}
.blue{stroke:#1565c0;fill:none} .green{stroke:#2e7d32;fill:none} .red{stroke:#c62828;fill:none} .orange{stroke:#ef6c00;fill:none} .purple{stroke:#6a1b9a;fill:none} .teal{stroke:#00838f;fill:none}
.bluefill{fill:#1565c0} .greenfill{fill:#2e7d32} .redfill{fill:#c62828} .orangefill{fill:#ef6c00} .purplefill{fill:#6a1b9a} .mutedfill{fill:#546e7a}
.label{font:28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#263238} .small{font:24px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#37474f} .tiny{font:21px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#455a64} .strong{font-weight:700} .center{text-anchor:middle} .right{text-anchor:end}
</style>
<defs>
<marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#263238"/></marker>
<marker id="arrow-blue" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#1565c0"/></marker>
<marker id="arrow-green" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#2e7d32"/></marker>
<marker id="arrow-red" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#c62828"/></marker>
<marker id="arrow-orange" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#ef6c00"/></marker>
<marker id="arrow-purple" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#6a1b9a"/></marker>
<marker id="arrow-start" markerWidth="12" markerHeight="10" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L11,8 L0,4 z" fill="#263238"/></marker>
</defs>
<rect class="bg" x="1" y="1" width="758" height="613" rx="18" stroke="#cfd8dc" stroke-width="2"/>
<text x="380" y="43" class="label strong center">Lực đàn hồi và lực kéo về không phải cùng một khái niệm</text>
<line x1="60" y1="90" x2="700" y2="90" class="axis"/>
<text x="210" y="125" class="small strong center">Tại VTCB: x = 0</text><text x="560" y="125" class="small strong center">Ở dưới VTCB: x &gt; 0</text>
<line x1="145" y1="145" x2="275" y2="145" class="axis"/><polyline points="210.0,145.0 210.0,163.0 227.0,171.8 193.0,180.7 227.0,189.5 193.0,198.3 227.0,207.2 193.0,216.0 227.0,224.8 193.0,233.7 227.0,242.5 193.0,251.3 227.0,260.2 193.0,269.0 227.0,277.8 193.0,286.7 227.0,295.5 193.0,304.3 227.0,313.2 210.0,322.0 210.0,340.0" stroke="#1565c0" stroke-width="5" fill="none"/><rect x="168" y="340" width="84" height="60" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/><text x="210" y="379" class="small strong center">m</text><line x1="495" y1="145" x2="625" y2="145" class="axis"/><polyline points="560.0,145.0 560.0,163.0 577.0,175.7 543.0,188.4 577.0,201.2 543.0,213.9 577.0,226.6 543.0,239.3 577.0,252.1 543.0,264.8 577.0,277.5 543.0,290.2 577.0,302.9 543.0,315.7 577.0,328.4 543.0,341.1 577.0,353.8 543.0,366.6 577.0,379.3 560.0,392.0 560.0,410.0" stroke="#1565c0" stroke-width="5" fill="none"/><rect x="518" y="410" width="84" height="60" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/><text x="560" y="449" class="small strong center">m</text><line x1="100" y1="340" x2="660" y2="340" class="guide"/><text x="92" y="347" class="tiny right">VTCB</text>
<!-- equilibrium forces -->
<line x1="180" y1="340" x2="180" y2="245" class="blue" stroke-width="5" marker-end="url(#arrow-blue)"/><text x="170" y="236" class="small right">Fđh</text>
<line x1="240" y1="340" x2="240" y2="435" class="red" stroke-width="5" marker-end="url(#arrow-red)"/><text x="250" y="460" class="small">mg</text>
<text x="210" y="510" class="tiny center">Fđh cân bằng mg ⇒ Fkv = 0</text>
<!-- displaced forces -->
<line x1="520" y1="410" x2="520" y2="245" class="blue" stroke-width="5" marker-end="url(#arrow-blue)"/><text x="510" y="236" class="small right">Fđh</text>
<line x1="600" y1="410" x2="600" y2="505" class="red" stroke-width="5" marker-end="url(#arrow-red)"/><text x="610" y="530" class="small">mg</text>
<line x1="670" y1="410" x2="670" y2="325" class="purple" stroke-width="6" marker-end="url(#arrow-purple)"/><text x="660" y="315" class="small right">Fkv</text>
<text x="380" y="552" class="tiny center">Fkv là hợp lực theo phương dao động; khi x ≠ 0, Fkv hướng về VTCB.</text><text x="380" y="580" class="tiny center">Fđh lại phụ thuộc độ biến dạng của lò xo so với chiều dài tự nhiên.</text>
</svg>
