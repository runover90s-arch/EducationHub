<svg xmlns="http://www.w3.org/2000/svg" width="760" height="750" viewBox="0 0 760 750" role="img" aria-labelledby="title desc">
<title id="title">Hai dạng trở về khi có lực cản</title>
<desc id="desc">Phần trên là dao động tắt dần còn qua lại vị trí cân bằng với đường bao giảm; phần dưới minh họa trường hợp cản rất lớn có thể trở về cân bằng mà không dao động qua lại.</desc>
