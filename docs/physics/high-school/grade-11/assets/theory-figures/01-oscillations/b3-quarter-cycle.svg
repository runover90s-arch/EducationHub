<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">Các mốc một phần tư chu kì trên đường tròn pha</title>
<desc id="desc">Đường tròn pha chia bốn cung bằng nhau, nối các góc không, pi trên hai, pi, ba pi trên hai và hai pi với các thời điểm không, T trên bốn, T trên hai, ba T trên bốn và T.</desc>
<style>
  .bg { fill: #ffffff; }
  .axis { stroke: #263238; stroke-width: 3; fill: none; }
  .grid { stroke: #cfd8dc; stroke-width: 1.5; stroke-dasharray: 6 6; fill: none; }
  .guide { stroke: #90a4ae; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
  .blue { stroke: #1565c0; fill: none; }
  .green { stroke: #2e7d32; fill: none; }
  .red { stroke: #c62828; fill: none; }
  .orange { stroke: #ef6c00; fill: none; }
  .purple { stroke: #6a1b9a; fill: none; }
  .bluefill { fill: #1565c0; }
  .greenfill { fill: #2e7d32; }
  .redfill { fill: #c62828; }
  .orangefill { fill: #ef6c00; }
  .purplefill { fill: #6a1b9a; }
  .mutedfill { fill: #546e7a; }
  .label { font: 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #263238; }
  .small { font: 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #37474f; }
  .tiny { font: 21px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #455a64; }
  .strong { font-weight: 700; }
  .center { text-anchor: middle; }
  .right { text-anchor: end; }
</style>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#263238"/></marker>
  <marker id="arrow-blue" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#1565c0"/></marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#2e7d32"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#c62828"/></marker>
  <marker id="arrow-orange" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#ef6c00"/></marker>

</defs>
<rect class="bg" x="1" y="1" width="758" height="558" rx="18" stroke="#cfd8dc" stroke-width="2"/>

<text x="380" y="42" class="label strong center">Một vòng pha 2π tương ứng một chu kì T</text>
<circle cx="380" cy="245" r="145" class="axis"/>
<path d="M 500 163 A 115 115 0 0 0 444 115" stroke="#1565c0" stroke-width="5" fill="none" marker-end="url(#arrow-blue)"/>
<path d="M 325 112 A 115 115 0 0 0 249 190" stroke="#1565c0" stroke-width="5" fill="none" marker-end="url(#arrow-blue)"/>
<path d="M 249 300 A 115 115 0 0 0 325 378" stroke="#1565c0" stroke-width="5" fill="none" marker-end="url(#arrow-blue)"/>
<path d="M 435 378 A 115 115 0 0 0 511 300" stroke="#1565c0" stroke-width="5" fill="none" marker-end="url(#arrow-blue)"/>
<circle cx="525" cy="245" r="10" class="bluefill"/>
<circle cx="380" cy="100" r="10" class="bluefill"/>
<circle cx="235" cy="245" r="10" class="bluefill"/>
<circle cx="380" cy="390" r="10" class="bluefill"/>
<text x="549" y="229" class="small strong">+A</text>
<text x="549" y="258" class="tiny">pha: 0 hoặc 2π</text>
<text x="549" y="284" class="tiny">t: 0 hoặc T</text>
<text x="380" y="62" class="small strong center">x = 0</text>
<text x="380" y="90" class="tiny center">pha: π/2</text>
<text x="380" y="117" class="tiny center">t: T/4</text>
<text x="211" y="229" class="small strong right">−A</text>
<text x="211" y="258" class="tiny right">pha: π</text>
<text x="211" y="284" class="tiny right">t: T/2</text>
<text x="380" y="427" class="small strong center">x = 0</text>
<text x="380" y="454" class="tiny center">pha: 3π/2</text>
<text x="380" y="480" class="tiny center">t: 3T/4</text>
<text x="380" y="510" class="tiny strong center">Mỗi khi pha tăng π/2, thời gian tăng T/4.</text>
<text x="380" y="535" class="tiny center">Các mốc trên cùng một vòng nên được suy ra từ quy tắc này.</text>

</svg>
