<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
<title id="title">Chuyển hóa năng lượng tại trừ A, O và cộng A</title>
<desc id="desc">Ba vị trí biên trái, vị trí cân bằng và biên phải cùng các cột thế năng và động năng: thế năng cực đại ở biên, động năng cực đại ở vị trí cân bằng.</desc>
<style>
