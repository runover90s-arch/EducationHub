<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">Hình chiếu của chuyển động tròn đều</title>
<desc id="desc">Điểm M chuyển động trên đường tròn bán kính A, góc pha Phi. Hình chiếu P lên trục Ox có tọa độ x bằng A cos Phi.</desc>
<style>
  .bg { fill: #ffffff; }
  .axis { stroke: #263238; stroke-width: 3; fill: none; }
  .grid { stroke: #cfd8dc; stroke-width: 1.5; stroke-dasharray: 6 6; fill: none; }
  .guide { stroke: #90a4ae; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
  .blue { stroke: #1565c0; fill: none; }
  .green { stroke: #2e7d32; fill: none; }
  .red { stroke: #c62828; fill: none; }
  .orange { stroke: #ef6c00; fill: none; }
  .purple { stroke: #6a1b9a; fill: none; }
  .bluefill { fill: #1565c0; }
  .greenfill { fill: #2e7d32; }
  .redfill { fill: #c62828; }
  .orangefill { fill: #ef6c00; }
  .purplefill { fill: #6a1b9a; }
  .mutedfill { fill: #546e7a; }
  .label { font: 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #263238; }
  .small { font: 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #37474f; }
  .tiny { font: 21px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #455a64; }
  .strong { font-weight: 700; }
  .center { text-anchor: middle; }
  .right { text-anchor: end; }
</style>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#263238"/></marker>
  <marker id="arrow-blue" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#1565c0"/></marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#2e7d32"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#c62828"/></marker>
  <marker id="arrow-orange" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#ef6c00"/></marker>

</defs>
<rect class="bg" x="1" y="1" width="758" height="428" rx="18" stroke="#cfd8dc" stroke-width="2"/>

<text x="380" y="42" class="label strong center">Chuyển động tròn đều → dao động điều hòa</text>
<circle cx="235" cy="230" r="135" class="axis"/>
<line x1="65" y1="230" x2="470" y2="230" class="axis" marker-end="url(#arrow)"/>
<line x1="235" y1="395" x2="235" y2="65" class="grid"/>
<line x1="235" y1="230" x2="312.4" y2="119.4" stroke="#1565c0" stroke-width="5"/>
<line x1="312.4" y1="119.4" x2="312.4" y2="230.0" class="guide"/>
<circle cx="312.4" cy="119.4" r="9" class="bluefill"/>
<circle cx="312.4" cy="230.0" r="9" class="orangefill"/>
<circle cx="235" cy="230" r="6" class="mutedfill"/>
<text x="328.4" y="111.4" class="small strong">M</text>
<text x="327.4" y="261.0" class="small strong">P</text>
<text x="219" y="261" class="small strong">O</text>
<text x="378" y="216" class="small strong">A</text>
<path d="M 301.0 230.0 A 66 66 0 0 0 272.9 175.9" stroke="#6a1b9a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<text x="315" y="194" class="label strong purplefill">Φ</text>
<line x1="235" y1="282" x2="312.4" y2="282" stroke="#ef6c00" stroke-width="4" marker-start="url(#arrow-orange)" marker-end="url(#arrow-orange)"/>
<text x="273.7" y="318" class="small strong center">OP = x</text>

<rect x="500" y="92" width="220" height="250" rx="16" fill="#f7f9fa" stroke="#cfd8dc" stroke-width="2"/>
<text x="520" y="132" class="small strong">Tương ứng:</text>
<text x="520" y="173" class="small">OM = A</text>
<text x="520" y="214" class="small">∠(Ox, OM) = Φ</text>
<text x="520" y="255" class="small">OP = A cos Φ</text>
<text x="520" y="296" class="small">một vòng 2π ↔ T</text>
<text x="380" y="392" class="small center">Khi M quay đều, hình chiếu P dao động qua lại trên đoạn [−A, +A].</text>

</svg>
