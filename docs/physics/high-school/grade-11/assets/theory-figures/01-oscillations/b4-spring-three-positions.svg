<text x="380" y="570" class="tiny center">Li độ x được đo từ O. Dấu của x chỉ cho biết vật ở phía nào so với O.</text><text x="380" y="598" class="tiny center">Muốn biết vật đang đi sang trái hay phải phải xét thêm dấu của vận tốc.</text>
