<title id="title">So sánh sin alpha và alpha</title>
<desc id="desc">Đồ thị y bằng sin alpha và y bằng alpha theo alpha tính bằng radian; hai đường gần trùng nhau quanh alpha bằng không và tách dần khi góc lớn hơn.</desc>
