<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="Inter, Arial, sans-serif" role="img" aria-label="Ba giản đồ vectơ quay minh họa tổng hợp hai dao động cùng pha vuông pha và ngược pha">
<title>Ba giản đồ vectơ quay minh họa tổng hợp hai dao động cùng pha vuông pha và ngược pha</title>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/></marker>
  <marker id="arrowStart" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M8,0 L0,4 L8,8 z" fill="context-stroke"/></marker>
</defs>
<rect x="1" y="1" width="718" height="558" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
<text x="360" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="#18212f" >Giản đồ vectơ quay: biên độ tổng hợp phụ thuộc độ lệch pha</text>
<text x="90" y="80" text-anchor="start" font-size="18" font-weight="700" fill="#18212f" >Cùng pha</text>
<line x1="300" y1="125" x2="405" y2="125" stroke="#2563eb" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="357.75" y="113" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb" >A₁</text>
<line x1="300" y1="125" x2="375.0" y2="125.0" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="349.25" y="147.0" text-anchor="start" font-size="17" font-weight="700" fill="#d97706" >A₂</text>
<line x1="300" y1="125" x2="480.0" y2="125.0" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="490.0" y="115.0" text-anchor="start" font-size="18" font-weight="700" fill="#7c3aed" >A</text>
<text x="555" y="131" text-anchor="start" font-size="18" font-weight="700" fill="#6b7280" >A = A₁ + A₂</text>
<text x="90" y="235" text-anchor="start" font-size="18" font-weight="700" fill="#18212f" >Vuông pha</text>
<line x1="300" y1="280" x2="405" y2="280" stroke="#2563eb" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="357.75" y="268" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb" >A₁</text>
<line x1="300" y1="280" x2="300.0" y2="205.0" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="308.0" y="260.75" text-anchor="start" font-size="17" font-weight="700" fill="#d97706" >A₂</text>
<line x1="300" y1="280" x2="405.0" y2="205.0" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="415.0" y="227.0" text-anchor="start" font-size="18" font-weight="700" fill="#7c3aed" >A</text>
<text x="555" y="286" text-anchor="start" font-size="18" font-weight="700" fill="#6b7280" >A = √(A₁²+A₂²)</text>
<text x="90" y="390" text-anchor="start" font-size="18" font-weight="700" fill="#18212f" >Ngược pha</text>
<line x1="300" y1="435" x2="405" y2="435" stroke="#2563eb" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="357.75" y="423" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb" >A₁</text>
<line x1="300" y1="435" x2="225.0" y2="435.0" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="266.75" y="457.0" text-anchor="start" font-size="17" font-weight="700" fill="#d97706" >A₂</text>
<line x1="300" y1="435" x2="330.0" y2="435.0" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="340.0" y="457.0" text-anchor="start" font-size="18" font-weight="700" fill="#7c3aed" >A</text>
<text x="555" y="441" text-anchor="start" font-size="18" font-weight="700" fill="#6b7280" >A = |A₁−A₂|</text>

</svg>
