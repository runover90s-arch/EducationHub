<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, Arial, sans-serif" role="img" aria-label="Các trạng thái dao động cho thấy vận tốc theo chiều chuyển động và gia tốc luôn hướng về vị trí cân bằng">
