<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Inter, Arial, sans-serif" role="img" aria-label="Trục dao động cho thấy hai biên, vị trí cân bằng, li độ tức thời và chiều chuyển động">
<title>Trục dao động cho thấy hai biên, vị trí cân bằng, li độ tức thời và chiều chuyển động</title>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/></marker>
  <marker id="arrowStart" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M8,0 L0,4 L8,8 z" fill="context-stroke"/></marker>
</defs>
<rect x="1" y="1" width="718" height="258" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
<text x="360" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#18212f" >Li độ được đo từ vị trí cân bằng O</text>
<line x1="95" y1="145" x2="625" y2="145" stroke="#18212f" stroke-width="4" stroke-linecap="round" opacity="1" />
<line x1="95" y1="131" x2="95" y2="159" stroke="#18212f" stroke-width="3" stroke-linecap="round" opacity="1" />
<text x="95" y="188" text-anchor="middle" font-size="22" font-weight="700" fill="#18212f" >−A</text>
<line x1="360" y1="131" x2="360" y2="159" stroke="#18212f" stroke-width="3" stroke-linecap="round" opacity="1" />
<text x="360" y="188" text-anchor="middle" font-size="22" font-weight="700" fill="#18212f" >O</text>
<line x1="625" y1="131" x2="625" y2="159" stroke="#18212f" stroke-width="3" stroke-linecap="round" opacity="1" />
<text x="625" y="188" text-anchor="middle" font-size="22" font-weight="700" fill="#18212f" >+A</text>
<circle cx="500" cy="145" r="14" fill="#2563eb" stroke="#2563eb" stroke-width="2" opacity="1"/>
<text x="500" y="117" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb" >vật</text>
<line x1="360" y1="90" x2="500" y2="90" stroke="#2563eb" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="430.0" y="75" text-anchor="middle" font-size="21" font-weight="700" fill="#2563eb" >x &gt; 0</text>
<line x1="500" y1="207" x2="410" y2="207" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="455" y="237" text-anchor="middle" font-size="20" font-weight="700" fill="#d97706" >v &lt; 0</text>

</svg>
