<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="Inter, Arial, sans-serif" role="img" aria-label="Sơ đồ các đoạn đường từ biên dương qua cân bằng đến biên âm và trở lại trong một chu kì">
<title>Sơ đồ các đoạn đường từ biên dương qua cân bằng đến biên âm và trở lại trong một chu kì</title>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/></marker>
  <marker id="arrowStart" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M8,0 L0,4 L8,8 z" fill="context-stroke"/></marker>
</defs>
<rect x="1" y="1" width="718" height="268" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
<text x="360" y="35" text-anchor="middle" font-size="23" font-weight="700" fill="#18212f" >Một chu kì: quãng đường là 4A, độ dời bằng 0</text>
<line x1="90" y1="130" x2="630" y2="130" stroke="#d1d5db" stroke-width="3" stroke-linecap="round" opacity="1" />
<circle cx="115" cy="130" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="1" opacity="1"/>
<text x="115" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#18212f" >+A</text>
<circle cx="235" cy="130" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="1" opacity="1"/>
<text x="235" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#18212f" >O</text>
<circle cx="355" cy="130" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="1" opacity="1"/>
<text x="355" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#18212f" >−A</text>
<circle cx="475" cy="130" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="1" opacity="1"/>
<text x="475" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#18212f" >O</text>
<circle cx="595" cy="130" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="1" opacity="1"/>
<text x="595" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#18212f" >+A</text>
<line x1="127" y1="100" x2="223" y2="100" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="175.0" y="87" text-anchor="middle" font-size="18" font-weight="700" fill="#7c3aed" >A</text>
<line x1="247" y1="100" x2="343" y2="100" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="295.0" y="87" text-anchor="middle" font-size="18" font-weight="700" fill="#7c3aed" >A</text>
<line x1="367" y1="100" x2="463" y2="100" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="415.0" y="87" text-anchor="middle" font-size="18" font-weight="700" fill="#7c3aed" >A</text>
<line x1="487" y1="100" x2="583" y2="100" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="535.0" y="87" text-anchor="middle" font-size="18" font-weight="700" fill="#7c3aed" >A</text>
<text x="360" y="222" text-anchor="middle" font-size="21" font-weight="700" fill="#7c3aed" >S = A + A + A + A = 4A</text>
</svg>
