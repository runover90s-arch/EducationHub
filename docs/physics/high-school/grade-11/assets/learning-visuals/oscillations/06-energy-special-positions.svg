<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, Arial, sans-serif" role="img" aria-label="Ba vị trí đặc biệt của dao động cho thấy động năng cực đại ở cân bằng và thế năng cực đại ở hai biên">
<title>Ba vị trí đặc biệt của dao động cho thấy động năng cực đại ở cân bằng và thế năng cực đại ở hai biên</title>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/></marker>
  <marker id="arrowStart" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M8,0 L0,4 L8,8 z" fill="context-stroke"/></marker>
</defs>
<rect x="1" y="1" width="718" height="358" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
<text x="360" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="#18212f" >Năng lượng đổi dạng khi vật đi giữa biên và cân bằng</text>
<line x1="90" y1="175" x2="630" y2="175" stroke="#18212f" stroke-width="4" stroke-linecap="round" opacity="1" />
<line x1="130" y1="164" x2="130" y2="186" stroke="#18212f" stroke-width="2" stroke-linecap="round" opacity="1" />
<circle cx="130" cy="175" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1" opacity="1"/>
<text x="130" y="213" text-anchor="middle" font-size="19" font-weight="700" fill="#18212f" >−A</text>
<text x="130" y="90" text-anchor="middle" font-size="18" font-weight="700" fill="#d97706" >v=0</text>
<text x="130" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#059669" >Wđ=0</text>
<text x="130" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#7c3aed" >Wt=W</text>
<line x1="360" y1="164" x2="360" y2="186" stroke="#18212f" stroke-width="2" stroke-linecap="round" opacity="1" />
<circle cx="360" cy="175" r="11" fill="#059669" stroke="#059669" stroke-width="1" opacity="1"/>
<text x="360" y="213" text-anchor="middle" font-size="19" font-weight="700" fill="#18212f" >O</text>
<text x="360" y="90" text-anchor="middle" font-size="18" font-weight="700" fill="#d97706" >|v|=vmax</text>
<text x="360" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#059669" >Wđ=W</text>
<text x="360" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#7c3aed" >Wt=0</text>
<line x1="590" y1="164" x2="590" y2="186" stroke="#18212f" stroke-width="2" stroke-linecap="round" opacity="1" />
<circle cx="590" cy="175" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1" opacity="1"/>
<text x="590" y="213" text-anchor="middle" font-size="19" font-weight="700" fill="#18212f" >+A</text>
<text x="590" y="90" text-anchor="middle" font-size="18" font-weight="700" fill="#d97706" >v=0</text>
<text x="590" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#059669" >Wđ=0</text>
<text x="590" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#7c3aed" >Wt=W</text>
<line x1="147" y1="145" x2="335" y2="145" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<line x1="573" y1="145" x2="385" y2="145" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="360" y="330" text-anchor="middle" font-size="18" font-weight="500" fill="#6b7280" >Trong mô hình lí tưởng: W = Wđ + Wt không đổi.</text>
</svg>
