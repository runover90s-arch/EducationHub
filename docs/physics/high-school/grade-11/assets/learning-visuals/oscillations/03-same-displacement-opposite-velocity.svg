<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Inter, Arial, sans-serif" role="img" aria-label="Hai điểm trên đường tròn pha có cùng li độ A trên 2 nhưng vận tốc trái dấu">
<title>Hai điểm trên đường tròn pha có cùng li độ A trên 2 nhưng vận tốc trái dấu</title>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/></marker>
  <marker id="arrowStart" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M8,0 L0,4 L8,8 z" fill="context-stroke"/></marker>
</defs>
<rect x="1" y="1" width="718" height="428" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
<text x="360" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="#18212f" >Cùng x = A/2 nhưng có thể có hai chiều chuyển động</text>
<circle cx="300" cy="220" r="135" fill="#fbfdff" stroke="#18212f" stroke-width="3" opacity="1"/>
<line x1="130" y1="220" x2="515" y2="220" stroke="#18212f" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<line x1="300" y1="220" x2="367.5" y2="103.0865704891008" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round" opacity="1" />
<circle cx="367.5" cy="103.0865704891008" r="8" fill="#7c3aed" stroke="#7c3aed" stroke-width="1" opacity="1"/>
<line x1="367.5" y1="103.0865704891008" x2="367.5" y2="220" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/>
<text x="382.5" y="93.0865704891008" text-anchor="start" font-size="18" font-weight="700" fill="#7c3aed" >Φ₁ = π/3</text>
<text x="545" y="150" text-anchor="start" font-size="22" font-weight="700" fill="#7c3aed" >v &lt; 0</text>
<text x="545" y="180" text-anchor="start" font-size="17" font-weight="500" fill="#6b7280" >v = −ωA sin Φ</text>
<line x1="300" y1="220" x2="367.5" y2="336.9134295108992" stroke="#059669" stroke-width="3.5" stroke-linecap="round" opacity="1" />
<circle cx="367.5" cy="336.9134295108992" r="8" fill="#059669" stroke="#059669" stroke-width="1" opacity="1"/>
<line x1="367.5" y1="336.9134295108992" x2="367.5" y2="220" stroke="#059669" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/>
<text x="382.5" y="360.9134295108992" text-anchor="start" font-size="18" font-weight="700" fill="#059669" >Φ₂ = 5π/3</text>
<text x="545" y="250" text-anchor="start" font-size="22" font-weight="700" fill="#059669" >v &gt; 0</text>
<text x="545" y="280" text-anchor="start" font-size="17" font-weight="500" fill="#6b7280" >v = −ωA sin Φ</text>
<circle cx="367.5" cy="220" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="1" opacity="1"/>
<text x="367.5" y="254" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb" >x=A/2</text>

</svg>
