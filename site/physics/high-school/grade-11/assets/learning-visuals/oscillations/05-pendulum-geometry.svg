<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Inter, Arial, sans-serif" role="img" aria-label="Con lắc đơn với điểm treo chiều dài dây góc lệch vị trí cân bằng và cung chuyển động">
